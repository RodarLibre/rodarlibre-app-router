    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        height: 100%;
        background: #0b0b0b;
        font-family: 'Inter', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100svh;
        padding: 2rem 1.5rem;
        background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(247, 201, 72, 0.12) 0%, transparent 70%);
      }

      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3.5rem;
        width: 100%;
        max-width: 400px;
        animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* ── Logo ── */
      .logo {
        width: 100%;
        max-width: 320px;
        display: flex;
        justify-content: center;
      }
      .logo img {
        width: 100%;
        height: auto;
        display: block;
      }

      /* ── Store buttons ── */
      .stores {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        width: 100%;
      }

      .store-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #141414;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 20px;
        padding: 1.75rem 2rem;
        text-decoration: none;
        transition: background 0.18s, border-color 0.18s, transform 0.15s, box-shadow 0.18s;
        width: 100%;
      }
      .store-btn:hover {
        background: #1e1e1e;
        border-color: rgba(255,255,255,0.18);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      }
      .store-btn:active {
        transform: translateY(0);
        box-shadow: none;
      }
      .store-btn svg {
        width: 100%;
        max-width: 240px;
        height: auto;
      }
    </style>
